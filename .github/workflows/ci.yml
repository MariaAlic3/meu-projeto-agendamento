# CI da Agenda do Salão (React + Vite + TypeScript).
# Referência: github.com/oliviasmim/demo-verificadores-nest (branch gabarito),
# adaptado para esta stack.
#
# Contrato com o package.json: lint, typecheck, build e test.
# Node 22 em todos os jobs (mesma versão usada no desenvolvimento local).
# Cada job é um "sensor" independente; a branch protection exige todos verdes.
# É o mesmo verificador do pre-commit (Husky), mas rodando no GitHub,
# onde não dá para pular com "git commit --no-verify".

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Permissão mínima: os jobs só leem o repositório.
permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm run lint # oxlint

  typecheck:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      # Verifica tsconfig.app.json e tsconfig.node.json (o tsconfig.json da
      # raiz tem "files": [] e sozinho não verificaria nada).
      - run: npm run typecheck

  build:
    name: Build
    runs-on: ubuntu-latest
    # Só builda se passou lint e type check — não gasta minuto de runner
    # buildando código que já sabemos que tem problema.
    needs: [lint, typecheck]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm run build # tsc -b && vite build

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm test # vitest run (inclui os cenários BDD)
